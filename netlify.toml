[build]
  publish   = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Daily PPM check at 07:00 Riyadh (04:00 UTC). Also keeps the free database awake.
[functions."ppm-check"]
  schedule = "0 4 * * *"

# Nice API paths: /api/board → /.netlify/functions/board
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
