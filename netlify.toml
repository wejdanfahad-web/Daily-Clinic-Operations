[build]
  publish   = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# 07:30 Riyadh (04:30 UTC): deliver notifications held overnight, then the daily PPM check.
# Also keeps the free database awake. No notification is ever sent between 16:30 and 07:30.
[functions."ppm-check"]
  schedule = "30 4 * * *"

# 16:00 Riyadh (13:00 UTC), before quiet hours: record tomorrow's Instruments / Crash cart duties and notify.
[functions."duties-cron"]
  schedule = "0 13 * * *"

# 14:00 Riyadh (11:00 UTC): remind the CIC if the next two working days have no published schedule.
[functions."publish-check"]
  schedule = "0 11 * * *"

# 08:45 and 12:45 Riyadh (05:45 / 09:45 UTC): tell the CIC if nobody is on Vitals for the session.
[functions."vitals-check-am"]
  schedule = "45 5 * * *"
[functions."vitals-check-pm"]
  schedule = "45 9 * * *"

# Nice API paths: /api/board → /.netlify/functions/board
[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# Pages and scripts are always re-checked, so an update shows on the next reload.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
